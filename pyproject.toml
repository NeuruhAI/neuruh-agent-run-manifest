[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuruh-agent-run-manifest"
version = "0.1.0a0"
description = "Deterministic, content-bound run manifest for governed agent systems."
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Jeramie Hicks / Neuruh"}]

[project.scripts]
neuruh-agent-run-manifest = "neuruh_agent_run_manifest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
